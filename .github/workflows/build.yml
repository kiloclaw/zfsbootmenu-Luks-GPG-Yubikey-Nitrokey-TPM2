name: Build check
on:
  push:
    branches:
      - master
    paths:
      - 'legacy/**'
      - 'packaging/**'
      - 'config/**'
      - 'scripts/**'
      # Images include zbm and are built with the Rust generate-zbm
      - 'crates/**'
      - 'vendor/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/luks/vm/**'
      # The VM test harness
      - 'rust-toolchain.toml'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'legacy/**'
      - 'packaging/**'
      - 'config/**'
      - 'scripts/**'
      # Images include zbm and are built with the Rust generate-zbm
      - 'crates/**'
      - 'vendor/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/luks/vm/**'
      # The VM test harness
      - 'rust-toolchain.toml'
      - '.github/workflows/build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build boot images
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: /tmp/zbm-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the build container
        run: docker build -t localhost/zbm-builder packaging/container

      - name: Prepare repository for build
        run: |
          mkdir -p "${BUILD_DIR}"
          docker run --rm -v "${PWD}:/zbm" -v "${BUILD_DIR}:/build" \
            --entrypoint /bin/bash localhost/zbm-builder -c '
              echo "zfsbootmenu_module_root=/zbm/legacy/zfsbootmenu" > /zbm/config/zfsbootmenu/dracut.conf.d/zbm_modroot.conf
              yq-go e ".Global.DracutFlags += [\"--no-early-microcode\"]" /zbm/config/zbm-builder/config.yaml > /build/config.yaml
            '

      - name: Build release artifacts
        run: |
          sudo rm -rf "${BUILD_DIR}/dracut.conf.d" "${BUILD_DIR}/build"
          mkdir -p "${BUILD_DIR}/dracut.conf.d"
          cp config/zfsbootmenu/release.conf.d/*.conf "${BUILD_DIR}/dracut.conf.d/"
          docker run --rm -v "${PWD}:/zbm" -v "${BUILD_DIR}:/build" localhost/zbm-builder -- --debug
          sudo chown -R "$(id -u):$(id -g)" "${BUILD_DIR}"

      - name: Archive release EFI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Release-EFI
          path: /tmp/zbm-build/build/*.EFI

      - name: Archive release components
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Release-Components
          path: |
            /tmp/zbm-build/build/*
            !/tmp/zbm-build/build/*.EFI

      - name: Build recovery artifacts
        run: |
          sudo rm -rf "${BUILD_DIR}/dracut.conf.d" "${BUILD_DIR}/build"
          mkdir -p "${BUILD_DIR}/dracut.conf.d"
          cp config/zfsbootmenu/recovery.conf.d/*.conf "${BUILD_DIR}/dracut.conf.d/"
          docker run --rm -v "${PWD}:/zbm" -v "${BUILD_DIR}:/build" localhost/zbm-builder -- --debug
          sudo chown -R "$(id -u):$(id -g)" "${BUILD_DIR}"

      - name: Archive recovery EFI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Recovery-EFI
          path: /tmp/zbm-build/build/*.EFI

      - name: Archive recovery components
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Recovery-Components
          path: |
            /tmp/zbm-build/build/*
            !/tmp/zbm-build/build/*.EFI

  reproducible:
    name: Reproducible release image
    # ROADMAP.md #5: the release image, built twice from checkouts in different directories with SOURCE_DATE_EPOCH
    # set from the last commit, must be the same bytes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: first

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: second/checkout

      - name: Create the build container
        run: docker build -t localhost/zbm-builder first/packaging/container

      - name: Build the release image twice
        run: |
          epoch="$( git -C first log -1 --format=%ct )"
          for tree in first second/checkout; do
            src="${PWD}/${tree}"
            out="${RUNNER_TEMP}/${tree%%/*}"
            mkdir -p "${out}/dracut.conf.d"
            cp "${src}"/config/zfsbootmenu/release.conf.d/*.conf "${out}/dracut.conf.d/"
            docker run --rm -v "${src}:/zbm" -v "${out}:/build" --entrypoint /bin/bash localhost/zbm-builder -c '
              echo "zfsbootmenu_module_root=/zbm/legacy/zfsbootmenu" > /zbm/config/zfsbootmenu/dracut.conf.d/zbm_modroot.conf
              yq-go e ".Global.DracutFlags += [\"--no-early-microcode\"]" /zbm/config/zbm-builder/config.yaml > /build/config.yaml
            '
            docker run --rm -e "SOURCE_DATE_EPOCH=${epoch}" -v "${src}:/zbm" -v "${out}:/build" \
              localhost/zbm-builder -- --debug
          done
          sudo chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP}/first" "${RUNNER_TEMP}/second"

      - name: Compare the two builds
        run: |
          status=0
          for file in initramfs-bootmenu.img vmlinuz-bootmenu vmlinuz.EFI; do
            if cmp "${RUNNER_TEMP}/first/build/${file}" "${RUNNER_TEMP}/second/build/${file}"; then
              echo "identical: ${file}"
            else
              status=1
            fi
          done
          # On a difference, say whether the contents differ too, or only the archives
          if [ "${status}" -ne 0 ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends dracut-core
            first/scripts/dev/compare-images.sh "${RUNNER_TEMP}/first/build" "${RUNNER_TEMP}/second/build" || true
          fi
          exit "${status}"

  runtime:
    name: Start-up and pool import with each runtime
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ZBMTEST_WORK: /tmp/zbm-vm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the VM test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf gdisk e2fsprogs dosfstools mtools

      # Installs the toolchain named in rust-toolchain.toml
      - name: Build the VM test harness
        run: |
          rustup toolchain install
          cargo build --release --locked -p zbm-vmtest

      - name: Create the build container
        run: docker build -t localhost/zbm-builder packaging/container

      - name: Rust runtime
        run: >-
          sudo -E target/release/zbm-vmtest run runtime-setup
          runtime-rust runtime-rust-hostid runtime-rust-strict runtime-rust-force runtime-rust-prefer runtime-rust-late runtime-rust-waitfor runtime-rust-hooks runtime-rust-signals

      - name: Archive the test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Runtime-VM-Logs
          path: /tmp/zbm-vm/tests
