name: Rust
on:
  push:
    branches:
      - master
    paths:
      - 'crates/**'
      - 'vendor/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'xtask/**'
      - 'deny.toml'
      # Parity tests run the legacy code they are compared with
      - 'legacy/**'
      - 'tests/luks/unit/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'vendor/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'xtask/**'
      - 'deny.toml'
      # Parity tests run the legacy code they are compared with
      - 'legacy/**'
      - 'tests/luks/unit/**'
      - '.github/workflows/rust.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain and components named in rust-toolchain.toml
      - name: Install toolchain
        run: rustup toolchain install

      # The parity tests run the Perl generate-zbm, which needs these modules,
      # and build EFI bundles from the systemd stub
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libyaml-pp-perl libsort-versions-perl libboolean-perl \
            systemd-boot-efi binutils

      # rustfmt, line widths, clippy (also on the test build of zbm), rustdoc, dependency layers and code metrics;
      # see docs/dev/tooling.md
      - name: Lint
        run: cargo xtask lint

      # The workspace and the test build of zbm, used by the LUKS unit suites (tests/luks/unit/impl.sh)
      - name: Test
        run: cargo xtask test

      # Images never contain the test build: the release zbm must not have the
      # command that runs the unit suites' operations
      - name: The release zbm has no test command
        run: |
          cargo build --release -p zbm --locked
          if target/release/zbm --list | grep '^zbm-luks-test '; then
            echo "the release zbm contains the test command zbm-luks-test" >&2
            exit 1
          fi

  strict:
    name: Strict lints (report only)
    # The lints that crates must pass once REFACTOR-ROADMAP.md has refactored them; the counts go to the job summary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: rustup toolchain install

      - name: Report
        run: cargo xtask lint --strict

  deny:
    name: Licences, advisories and banned crates
    # deny.toml; vendor/README.md says why each crate is there
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2

  luks-unit:
    name: LUKS unit suites with each implementation
    # The suites need root, loop devices and the tools of the boot images; see
    # docs/luks/testing.rst
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: rustup toolchain install

      - name: Install the tools of the suites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cryptsetup-bin swtpm swtpm-tools tpm2-tools clevis clevis-luks clevis-tpm2 \
            jose gnupg fido2-tools fdisk e2fsprogs openssl

      - name: Build the test build of zbm
        run: CARGO_TARGET_DIR=target/test-seams cargo build -p zbm --features test-seams --locked

      - name: Legacy
        run: sudo env ZBMTEST_UNIT_WORK=/var/tmp/zbm-luks-unit-legacy tests/luks/unit/run-all.sh

      - name: Rust
        run: |
          sudo env ZBMTEST_IMPL=rust ZBMTEST_UNIT_WORK=/var/tmp/zbm-luks-unit-rust \
            tests/luks/unit/run-all.sh

      - name: Archive the suite output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LUKS-Unit-Output
          path: /var/tmp/zbm-luks-unit-*

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Keep in sync with rust-version in Cargo.toml
      - name: Install toolchain
        run: rustup toolchain install 1.88 --profile minimal

      - name: Check
        run: cargo +1.88 check --workspace --all-targets --locked

  targets:
    name: Other targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # musl systems (Alpine, Void musl) and aarch64, which ZFSBootMenu supports
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Check
        run: cargo check --workspace --all-targets --locked --target ${{ matrix.target }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          rustup toolchain install
          rustup component add llvm-tools

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libyaml-pp-perl libsort-versions-perl libboolean-perl \
            systemd-boot-efi binutils

      - name: Measure line coverage
        run: |
          cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tee coverage.txt
          {
            echo '## Line coverage'
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Archive the coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            lcov.info
            coverage.txt
