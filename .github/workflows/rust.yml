name: Rust
on:
  push:
    branches:
      - master
    paths:
      - 'crates/**'
      - 'vendor/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'scripts/dev/check-rust-width.sh'
      # Parity tests run the legacy code they are compared with
      - 'legacy/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'vendor/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'scripts/dev/check-rust-width.sh'
      # Parity tests run the legacy code they are compared with
      - 'legacy/**'
      - '.github/workflows/rust.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain and components named in rust-toolchain.toml
      - name: Install toolchain
        run: rustup toolchain install

      # The parity tests run the Perl generate-zbm, which needs these modules,
      # and build EFI bundles from the systemd stub
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libyaml-pp-perl libsort-versions-perl libboolean-perl \
            systemd-boot-efi binutils

      - name: Check formatting
        run: cargo fmt --all --check

      # The line widths of the Rust Style Guide that rustfmt leaves alone
      - name: Check line widths
        run: scripts/dev/check-rust-width.sh

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Documentation
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Keep in sync with rust-version in Cargo.toml
      - name: Install toolchain
        run: rustup toolchain install 1.85 --profile minimal

      - name: Check
        run: cargo +1.85 check --workspace --all-targets --locked

  targets:
    name: Other targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # musl systems (Alpine, Void musl) and aarch64, which ZFSBootMenu supports
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Check
        run: cargo check --workspace --all-targets --locked --target ${{ matrix.target }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          rustup toolchain install
          rustup component add llvm-tools

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libyaml-pp-perl libsort-versions-perl libboolean-perl \
            systemd-boot-efi binutils

      - name: Measure line coverage
        run: |
          cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tee coverage.txt
          {
            echo '## Line coverage'
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Archive the coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            lcov.info
            coverage.txt
