name: Rust
on:
  push:
    branches:
      - master
    paths:
      - 'crates/**'
      - 'vendor/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'xtask/**'
      - 'deny.toml'
      - '.config/nextest.toml'
      - 'fuzz/**'
      # Tests of the image build run the shell helpers in legacy/
      - 'legacy/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'vendor/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'xtask/**'
      - 'deny.toml'
      - '.config/nextest.toml'
      - 'fuzz/**'
      # Tests of the image build run the shell helpers in legacy/
      - 'legacy/**'
      - '.github/workflows/rust.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the toolchain and components named in rust-toolchain.toml
      - name: Install toolchain
        run: rustup toolchain install

      # The parity tests run the Perl generate-zbm, which needs these modules,
      # and build EFI bundles from the systemd stub
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libyaml-pp-perl libsort-versions-perl libboolean-perl \
            systemd-boot-efi binutils xkb-data libx11-data

      - name: Install cargo-nextest
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest

      # rustfmt, line widths, clippy (also on the test build of zbm), the strict lints of the crates in
      # xtask/strict/crates.txt, rustdoc, dependency layers and code metrics; see docs/dev/tooling.md
      - name: Lint
        run: cargo xtask lint

      # The workspace, under cargo nextest with the ci profile of .config/nextest.toml
      - name: Test
        run: cargo xtask test
        env:
          NEXTEST_PROFILE: ci

  strict:
    name: Strict lints
    # The lints that crates must pass once ROADMAP.md has refactored them, for every crate; the counts go to
    # the job summary. It fails only on a finding in a crate of xtask/strict/crates.txt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: rustup toolchain install

      - name: Report
        run: cargo xtask lint --strict

  deny:
    name: Licences, advisories and banned crates
    # deny.toml; docs/dev/dependencies.md says why each crate is there
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
  luks-devices:
    name: LUKS device tests
    # The suites need root, loop devices and the tools of the boot images; see
    # docs/luks/testing.rst
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: rustup toolchain install

      - name: Install the tools of the suites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cryptsetup-bin swtpm swtpm-tools tpm2-tools clevis clevis-luks clevis-tpm2 \
            jose gnupg fido2-tools fdisk e2fsprogs openssl

      # zbm-crypt against real LUKS volumes on loop devices (crates/zbm-crypt/tests/devices.rs)
      - name: Rust device tests
        run: |
          cargo test -p zbm-crypt --test devices --locked --no-run
          sudo env "PATH=${PATH}" "RUSTUP_HOME=${RUSTUP_HOME:-${HOME}/.rustup}" \
            "CARGO_HOME=${CARGO_HOME:-${HOME}/.cargo}" ZBM_DEVICE_TESTS=1 \
            cargo test -p zbm-crypt --test devices --locked

      # The LUKS code against real volumes (crates/zbm-luks/tests/devices)
      - name: LUKS device suites
        run: |
          cargo test -p zbm-luks --test devices --locked --no-run
          sudo env "PATH=${PATH}" "RUSTUP_HOME=${RUSTUP_HOME:-${HOME}/.rustup}" \
            "CARGO_HOME=${CARGO_HOME:-${HOME}/.cargo}" cargo xtask test devices

  links:
    name: zbm links glibc alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: rustup toolchain install

      # The release build, as images get it; readelf comes with binutils
      - name: Check the linked libraries
        run: cargo xtask check-links

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Keep in sync with rust-version in Cargo.toml
      - name: Install toolchain
        run: rustup toolchain install 1.88 --profile minimal

      - name: Check
        run: cargo +1.88 check --workspace --all-targets --locked

  targets:
    name: Other targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # musl systems (Alpine, Void musl) and aarch64, which ZFSBootMenu supports
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Check
        run: cargo check --workspace --all-targets --locked --target ${{ matrix.target }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: |
          rustup toolchain install
          rustup component add llvm-tools

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            systemd-boot-efi binutils xkb-data libx11-data

      # Line coverage per crate may only go up: xtask/coverage-baseline.txt, and 80% for a new crate. The table
      # goes to the job summary. It runs as root, as the baseline was measured: some tests run only as root
      - name: Check line coverage
        run: |
          sudo env "PATH=${PATH}" "RUSTUP_HOME=${RUSTUP_HOME:-${HOME}/.rustup}" \
            "CARGO_HOME=${CARGO_HOME:-${HOME}/.cargo}" "GITHUB_ACTIONS=${GITHUB_ACTIONS}" \
            "GITHUB_STEP_SUMMARY=${GITHUB_STEP_SUMMARY}" CARGO_TERM_COLOR=always \
            cargo xtask coverage --check

      - name: Write the coverage report
        if: ${{ !cancelled() }}
        run: |
          sudo env "PATH=${PATH}" "RUSTUP_HOME=${RUSTUP_HOME:-${HOME}/.rustup}" \
            "CARGO_HOME=${CARGO_HOME:-${HOME}/.cargo}" sh -c '
              cargo llvm-cov report --lcov --output-path lcov.info &&
              cargo llvm-cov report --summary-only > coverage.txt'
          cat coverage.txt

      - name: Archive the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            lcov.info
            coverage.txt
