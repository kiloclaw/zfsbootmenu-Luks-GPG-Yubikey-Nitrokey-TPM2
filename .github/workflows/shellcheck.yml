name: Analyze scripts
on:
  push:
    branches:
      - master
    paths:
      - '**.sh'
      - 'legacy/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'tests/**'
      - 'contrib/**'
  pull_request:
    paths:
      - '**.sh'
      - 'legacy/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'tests/**'
      - 'contrib/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Run ShellCheck
      uses: ludeeus/action-shellcheck@2.0.0
      with:
        severity: warning
