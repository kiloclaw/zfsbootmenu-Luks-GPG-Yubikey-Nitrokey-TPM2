[package]
name = "zbm"
description = "The ZFSBootMenu runtime: one program that acts as each of its commands, like BusyBox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde_json.workspace = true
zbm-app.workspace = true
zbm-boot.workspace = true
zbm-startup.workspace = true
zbm-config.workspace = true
zbm-console.workspace = true
zbm-display.workspace = true
zbm-luks.workspace = true
zbm-pool.workspace = true
zbm-platform.workspace = true
zbm-state.workspace = true
zbm-sys.workspace = true
tracing.workspace = true
zbm-trace.workspace = true
zbm-tui.workspace = true
zbm-types.workspace = true

[features]
# A test build for the crash report VM test: `zbm debug panic` panics.
crash-test = []
# A test build for the VM test secrets-*: `zbm debug secrets` searches the
# machine's processes and files in memory for secrets (ROADMAP.md #1).
secret-test = []
# A test build for the VM test runtime-rust-drm: `zbm debug menu-demo` runs the
# menu prototype on the display without a terminal (ROADMAP.md #19, step 1).
menu-demo = []
# A test build for the VM tests runtime-rust-console*: the console on the
# display writes its screen to the file `zbm.console_mirror` names.
console-mirror = ["zbm-startup/console-mirror"]

[dev-dependencies]
pretty_assertions.workspace = true
ratatui.workspace = true
serde.workspace = true
zbm-testkit.workspace = true

[lints]
workspace = true
