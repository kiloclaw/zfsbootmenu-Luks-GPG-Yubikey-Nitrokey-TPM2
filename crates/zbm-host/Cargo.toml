[package]
name = "zbm-host"
description = "The host tools of ZFSBootMenu: generate-zbm, which builds images, zbm-kcl, which reads and writes kernel command lines, and the plan of an image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "generate-zbm"
path = "src/bin/generate-zbm.rs"

[[bin]]
name = "zbm-kcl"
path = "src/bin/zbm-kcl.rs"

[dependencies]
yaml-rust2.workspace = true
zbm-config.workspace = true
zbm-display.workspace = true
zbm-platform.workspace = true
zbm-sys.workspace = true
zbm-tools.workspace = true
zbm-types.workspace = true
zbm-zfs.workspace = true

[dev-dependencies]
insta.workspace = true
pretty_assertions.workspace = true
serde.workspace = true
zbm-testkit.workspace = true

[lints]
workspace = true
