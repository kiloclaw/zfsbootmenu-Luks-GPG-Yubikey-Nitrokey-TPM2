nofsck="yes"
add_dracutmodules+=" zfsbootmenu bash "
omit_dracutmodules+=" btrfs zfs resume systemd systemd-initrd dracut-systemd plymouth dash clevis "

# ZFSBootMenu unlocks LUKS volumes itself (see zfsbootmenu(7)); the dracut crypt
# module would otherwise prompt for every LUKS volume before the menu starts
omit_dracutmodules+=" crypt "
