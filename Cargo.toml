# Cargo workspace for the Rust port of ZFSBootMenu.
#
# The bootloader that ships today is the Bash and Perl code in legacy/. The crates in crates/ replace it as planned in
# ROADMAP.md.
#
# Third-party crates are vendored in vendor/ (see .cargo/config.toml), so every build works offline.

[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/kiloclaw/zfsbootmenu-luks-gpg-yubikey-nitrokey-tpm2"
publish = false

[workspace.dependencies]
generate-zbm = { path = "crates/generate-zbm" }
zbm = { path = "crates/zbm" }
zbm-app = { path = "crates/zbm-app" }
zbm-brush = { path = "crates/zbm-brush" }
zbm-boot = { path = "crates/zbm-boot" }
zbm-config = { path = "crates/zbm-config" }
zbm-console = { path = "crates/zbm-console" }
zbm-crypt = { path = "crates/zbm-crypt" }
zbm-display = { path = "crates/zbm-display" }
zbm-kcl = { path = "crates/zbm-kcl" }
zbm-luks = { path = "crates/zbm-luks" }
zbm-pool = { path = "crates/zbm-pool" }
zbm-platform = { path = "crates/zbm-platform" }
zbm-startup = { path = "crates/zbm-startup" }
zbm-state = { path = "crates/zbm-state" }
zbm-sys = { path = "crates/zbm-sys" }
zbm-testkit = { path = "crates/zbm-testkit" }
zbm-trace = { path = "crates/zbm-trace" }
zbm-tools = { path = "crates/zbm-tools" }
zbm-tui = { path = "crates/zbm-tui" }
zbm-types = { path = "crates/zbm-types" }
zbm-zfs = { path = "crates/zbm-zfs" }
yaml-rust2 = { version = "0.13", default-features = false }
# The crates agreed for the refactoring (ROADMAP.md, "Decisions"), with the features it needs. A crate is
# vendored when the first workspace crate uses it; until then these lines only fix the versions and features.
crossterm = { version = "0.29", default-features = false, features = ["events"] }
insta = "1"
# PNG reference images of the console (zbm-testkit); already in the tree through the standard library.
miniz_oxide = "0.8.9"
nucleo-matcher = "0.3"
pretty_assertions = "1"
proptest = { version = "1", default-features = false, features = ["std"] }
ratatui = { version = "0.30", default-features = false, features = ["std", "crossterm", "layout-cache", "unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "registry"] }
uucore = { version = "0.12", features = ["version-cmp"] }
# The menu on the display without a terminal (ROADMAP.md #19, step 1): dumb buffers through DRM.
drm = { version = "=0.15.0", default-features = false }
# The console without the kernel's (ROADMAP.md #19, step 2): Alacritty's terminal on a pseudo-terminal, which
# `rustix` opens; `rustix`'s pidfds hold the processes signalled (ROADMAP.md PM3).
alacritty_terminal = { version = "=0.26.0", default-features = false }
rustix = { version = "1", default-features = false, features = ["std", "pty", "termios", "process"] }
# TrueType fonts for the console on the display (ROADMAP.md #19, step 3): parsed with skrifa, hinted and rasterized.
swash = { version = "=0.2.10", default-features = false, features = ["std", "scale", "render"] }
# Keyboard layouts for the console on the display (ROADMAP.md #19, step 4): XKB keymaps, compiled when the image is
# built, and their dead keys through a compose table.
kbvm = { version = "=0.1.7", default-features = false, features = ["compose"] }
# The shell of the Rust images (ROADMAP.md, "Decisions"): brush, a Bash-compatible shell in Rust, with its
# line editors. Its parser carries a patch of ours (patches/README.md).
brush-shell = { version = "=0.4.0" }
# The message catalogue of the menu (ROADMAP.md, R5 step 2): Project Fluent's bundle, already built for
# `uucore`, and its language identifiers.
fluent-bundle = "0.16"
unic-langid = "0.9"
# The hashes and encodings of the key methods (ROADMAP.md SE7, CD3): RustCrypto's SHA-2 and PBKDF2-HMAC, whose
# hash states are wiped when dropped (`zeroize`, which HMAC's take from SHA-2's), and the `base64` crate, already
# vendored for `alacritty_terminal`.
sha2 = { version = "=0.11.1", default-features = false, features = ["zeroize"] }
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["hmac"] }
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }

# `org.zfsbootmenu:kernel` (zbm-types, ROADMAP.md DM4), and the VM tests' console patterns.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
vt100 = { version = "0.18", default-features = false, features = ["std"] }
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
syn = { version = "2", default-features = false, features = ["full", "parsing", "visit"] }

[workspace.lints.rust]
# Crates that need FFI (signals, ioctl, kexec_file_load) allow it locally with #![allow(unsafe_code)] and document
# every unsafe block.
unsafe_code = "deny"
missing_docs = "warn"
# `cargo llvm-cov` builds with `--cfg coverage`: a confined process then lets
# its coverage profile be written (zbm_sys::sandbox).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
# Binaries end up in an initramfs, so size matters more than build time.
lto = true
# An overflow ends the program with a crash report instead of wrapping around
# to a wrong size or index (ROADMAP.md SE2).
overflow-checks = true
codegen-units = 1
# Line tables and function names stay in the build, for crash reports: images
# carry the binary without them (`cargo xtask split-debug`, which keeps them in
# a debug file named by the build ID for `cargo xtask symbolize`), and
# `make install` strips what it installs.
debug = "line-tables-only"
strip = false

# Crates built with a change of ours until their authors release it (patches/README.md).
[patch.crates-io]
brush-builtins = { path = "patches/brush-builtins-0.2.0" }
brush-interactive = { path = "patches/brush-interactive-0.4.0" }
brush-parser = { path = "patches/brush-parser-0.4.0" }
alacritty_terminal = { path = "patches/alacritty_terminal-0.26.0" }
vte = { path = "patches/vte-0.15.0" }
crossterm = { path = "patches/crossterm-0.29.0" }
