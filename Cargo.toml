# Cargo workspace for the Rust port of ZFSBootMenu.
#
# The bootloader that ships today is the Bash and Perl code in legacy/. The crates in crates/ replace it as planned in
# PORT-ROADMAP.md.
#
# Third-party crates are vendored in vendor/ (see .cargo/config.toml), so every build works offline.

[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/kiloclaw/zfsbootmenu-luks-gpg-yubikey-nitrokey-tpm2"
publish = false

[workspace.dependencies]
generate-zbm = { path = "crates/generate-zbm" }
zbm = { path = "crates/zbm" }
zbm-app = { path = "crates/zbm-app" }
zbm-boot = { path = "crates/zbm-boot" }
zbm-config = { path = "crates/zbm-config" }
zbm-core = { path = "crates/zbm-core" }
zbm-coreutils = { path = "crates/zbm-coreutils" }
zbm-console = { path = "crates/zbm-console" }
zbm-crypt = { path = "crates/zbm-crypt" }
zbm-display = { path = "crates/zbm-display" }
zbm-kcl = { path = "crates/zbm-kcl" }
zbm-luks = { path = "crates/zbm-luks" }
zbm-pool = { path = "crates/zbm-pool" }
zbm-menu = { path = "crates/zbm-menu" }
zbm-platform = { path = "crates/zbm-platform" }
zbm-startup = { path = "crates/zbm-startup" }
zbm-state = { path = "crates/zbm-state" }
zbm-sys = { path = "crates/zbm-sys" }
zbm-testkit = { path = "crates/zbm-testkit" }
zbm-trace = { path = "crates/zbm-trace" }
zbm-tools = { path = "crates/zbm-tools" }
zbm-tui = { path = "crates/zbm-tui" }
zbm-types = { path = "crates/zbm-types" }
zbm-zfs = { path = "crates/zbm-zfs" }
yaml-rust2 = { version = "0.13", default-features = false }
# The crates agreed for the refactoring (REFACTOR-ROADMAP.md, "Decisions"), with the features it needs. A crate is
# vendored when the first workspace crate uses it; until then these lines only fix the versions and features.
crossterm = { version = "0.29", default-features = false, features = ["events"] }
insta = "1"
nucleo-matcher = "0.3"
pretty_assertions = "1"
proptest = { version = "1", default-features = false, features = ["std"] }
ratatui = { version = "0.30", default-features = false, features = ["std", "crossterm", "layout-cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "registry"] }
uucore = { version = "0.12", features = ["version-cmp"] }
# The menu on the display without a terminal (ROADMAP.md #19, step 1): dumb buffers through DRM.
drm = { version = "=0.15.0", default-features = false }
# The console without the kernel's (ROADMAP.md #19, step 2): Alacritty's terminal on a pseudo-terminal, which
# `rustix` opens, and the signal that hands the display back before `kexec`.
alacritty_terminal = { version = "=0.26.0", default-features = false }
rustix = { version = "1", default-features = false, features = ["std", "pty", "termios", "process"] }
signal-hook = { version = "0.4", default-features = false }

# Used only by the developer tools (xtask, zbm-vmtest); never part of an image.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
vt100 = { version = "0.18", default-features = false, features = ["std"] }
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
syn = { version = "2", default-features = false, features = ["full", "parsing", "visit"] }

[workspace.lints.rust]
# Crates that need FFI (signals, ioctl, kexec_file_load) allow it locally with #![allow(unsafe_code)] and document
# every unsafe block.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
# Binaries end up in an initramfs, so size matters more than build time.
lto = true
codegen-units = 1
# Line tables and function names stay in the build, for crash reports: images
# carry the binary without them (`cargo xtask split-debug`, which keeps them in
# a debug file named by the build ID for `cargo xtask symbolize`), and
# `make install` strips what it installs.
debug = "line-tables-only"
strip = false
