# Cargo workspace for the Rust port of ZFSBootMenu.
#
# The bootloader that ships today is the Bash and Perl code in legacy/. The crates in crates/ replace it as planned in
# PORT-ROADMAP.md.
#
# Third-party crates are vendored in vendor/ (see .cargo/config.toml), so every build works offline.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/kiloclaw/zfsbootmenu-luks-gpg-yubikey-nitrokey-tpm2"
publish = false

[workspace.dependencies]
generate-zbm = { path = "crates/generate-zbm" }
zbm = { path = "crates/zbm" }
zbm-cmdline = { path = "crates/zbm-cmdline" }
zbm-core = { path = "crates/zbm-core" }
zbm-kcl = { path = "crates/zbm-kcl" }
zbm-log = { path = "crates/zbm-log" }
zbm-sys = { path = "crates/zbm-sys" }
zbm-testutil = { path = "crates/zbm-testutil" }
zbm-zfs = { path = "crates/zbm-zfs" }
yaml-rust2 = { version = "0.13", default-features = false }

[workspace.lints.rust]
# Crates that need FFI (signals, ioctl, kexec_file_load) allow it locally with #![allow(unsafe_code)] and document
# every unsafe block.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
# Binaries end up in an initramfs, so size matters more than build time.
lto = true
codegen-units = 1
strip = true
